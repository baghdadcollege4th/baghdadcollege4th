<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFD83A">
<title>منصة رئيس المرحلة الرابعة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800;900&family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
/* Layout: yellow top bar, big blue name block, 2x2 colour tiles, thick outlines with hard offset shadows. */
:root{
  --bg:#F2F4F7;--card:#FFFFFF;--ink:#101114;--mute:#5A6070;--line:#D5D9E2;--edge:#101114;
  --soft:#E6EBFF;--field:#F7F8FA;--brand:#2347F5;--onbrand:#FFFFFF;--accent:#FFD83A;--hdr:#FFD83A;--mebg:#FFF0A0;
  --ok:#0B7A43;--okbg:#D6F5E3;--warn:#7A5000;--warnbg:#FFEFB3;--bad:#C8261B;--badbg:#FFE1DD;
  --f-display:"Cairo","Segoe UI",Tahoma,sans-serif;--f-body:"Cairo","Segoe UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E0F12;--card:#181A1F;--ink:#F4F4F1;--mute:#9AA1B2;--line:#2C303A;--edge:#F4F4F1;
  --soft:#1E2440;--field:#121317;--brand:#8CA3FF;--onbrand:#0E0F12;--mebg:#3A3310;
  --ok:#52D391;--okbg:#143626;--warn:#FFD83A;--warnbg:#3A3010;--bad:#FF8B80;--badbg:#44201F;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E0F12;--card:#181A1F;--ink:#F4F4F1;--mute:#9AA1B2;--line:#2C303A;--edge:#F4F4F1;
  --soft:#1E2440;--field:#121317;--brand:#8CA3FF;--onbrand:#0E0F12;--mebg:#3A3310;
  --ok:#52D391;--okbg:#143626;--warn:#FFD83A;--warnbg:#3A3010;--bad:#FF8B80;--badbg:#44201F;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:500 1rem/1.8 var(--f-body);padding-bottom:104px;overflow-wrap:anywhere}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hdr);z-index:10}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{background:var(--hdr);color:#101114;border-bottom:3px solid #101114;padding:calc(10px + env(safe-area-inset-top,0px)) 0 10px}
.hrow{display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:10px;background:#101114;display:flex;align-items:center;justify-content:center;flex:none}
.logo svg{width:22px;height:22px}
.htxt{flex:1;min-width:0}
.htxt h1{margin:0;font:900 1.1rem/1.4 var(--f-display)}
.htxt p{margin:0;font-size:.76rem;font-weight:600;color:rgba(16,17,20,.72)}
.chip{background:#101114;color:#FFD83A;border:0;padding:6px 14px;border-radius:8px;font:800 .78rem var(--f-body);min-height:40px;max-width:46%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.chip.adm{background:#fff;color:#101114;border:2px solid #101114}
main{padding-block:18px}
h2.sec{display:inline-block;margin:26px 2px 12px;font:900 1.2rem/1.5 var(--f-display);text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:6px;text-underline-offset:5px;text-decoration-skip-ink:none}
h2.sec:first-child{margin-top:4px}
.chathead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.chathead h2.sec{margin:0}
.card{background:var(--card);border:2px solid var(--edge);border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:3px 3px 0 var(--edge)}
.card.urgent{box-shadow:3px 3px 0 var(--bad)}
.card.pinned{box-shadow:3px 3px 0 var(--accent)}
.card h3{margin:0 0 4px;font:800 1.05rem/1.6 var(--f-display)}
.card p{margin:8px 0}
.row2{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.row2>div{min-width:0}
.meta{color:var(--mute);font-size:.8rem;font-weight:600}
.tag{display:inline-block;font-size:.72rem;font-weight:800;padding:0 9px;border:1.5px solid var(--edge);border-radius:6px;background:var(--card);color:var(--ink);margin-left:6px}
.tag.ok{background:var(--okbg);color:var(--ok);border-color:var(--ok)}
.tag.warn{background:var(--warnbg);color:var(--warn);border-color:var(--warn)}
.tag.bad{background:var(--badbg);color:var(--bad);border-color:var(--bad)}
.tag.gold{background:var(--accent);color:#101114;border-color:#101114}
.hero{position:relative;display:flex;align-items:center;gap:16px;background:#2347F5;color:#fff;border:3px solid var(--edge);border-radius:14px;padding:24px 18px;box-shadow:5px 5px 0 var(--edge);overflow:hidden;margin-bottom:16px}
.hero::before{content:"";position:absolute;left:-34px;top:-34px;width:120px;height:120px;border-radius:50%;background:#FFD83A}
.hero::after{content:"";position:absolute;left:40px;bottom:-30px;width:64px;height:64px;background:#101114;transform:rotate(45deg)}
.seal{position:relative;z-index:1;width:68px;height:68px;border-radius:14px;flex:none;display:flex;align-items:center;justify-content:center;background:#FFD83A;color:#101114;border:3px solid #101114;font:900 2.1rem/1 var(--f-display)}
.hbody{position:relative;z-index:1;min-width:0}
.hero h2{margin:0;font:900 2rem/1.3 var(--f-display)}
.role{font-weight:700;font-size:.92rem;color:#FFD83A}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:8px}
.tile{position:relative;text-align:right;border:2px solid var(--edge);border-radius:12px;padding:14px 12px 12px;min-height:116px;display:flex;flex-direction:column;gap:1px;justify-content:flex-end;font:inherit;color:#101114;cursor:pointer;box-shadow:3px 3px 0 var(--edge);touch-action:manipulation;transition:transform .1s,box-shadow .1s}
.tile:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--edge)}
.tile svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;margin-bottom:auto}
.tile b{font:900 1.05rem/1.4 var(--f-display)}
.tile small{font-size:.78rem;font-weight:700;opacity:.8}
.t1{background:#FFD83A}.t2{background:#9FB4FF}.t3{background:#FF9E8A}.t4{background:#8FE3B5}
.dotbadge{width:13px;height:13px;border-radius:50%;background:var(--bad);border:2px solid var(--edge);flex:none}
.tile .dotbadge{position:absolute;top:10px;left:10px}
.letter{border-right:8px solid var(--accent);line-height:2;font-size:.98rem}
.letter p{margin:0 0 10px}
.letter p.bis{text-align:center;font:900 1.1rem var(--f-display);color:var(--brand)}
.letter .sign{margin:14px 0 0;padding-top:12px;border-top:2px solid var(--edge);line-height:1.9}
.letter .btn{margin-top:4px}
.mini{padding:10px 0;border-bottom:2px dashed var(--line)}.mini:last-child{border:0;padding-bottom:0}.mini:first-child{padding-top:0}
label{display:block;font-size:.8rem;color:var(--mute);margin:12px 0 5px;font-weight:700}
input,textarea,select{width:100%;padding:11px 13px;border:2px solid var(--edge);border-radius:10px;background:var(--field);color:var(--ink);font:inherit;font-weight:500;font-size:16px;min-height:48px}
textarea{min-height:96px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:0;box-shadow:3px 3px 0 var(--accent)}
.btn:focus-visible,.tile:focus-visible,.choice:focus-visible,nav button:focus-visible,.chip:focus-visible,.srow:focus-visible,.lnk:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.cols{display:flex;gap:10px;flex-wrap:wrap}.cols>*{flex:1;min-width:140px}
.btn{background:var(--brand);color:var(--onbrand);border:2px solid var(--edge);border-radius:10px;padding:10px 20px;cursor:pointer;font:800 .92rem var(--f-body);min-height:46px;box-shadow:3px 3px 0 var(--edge);touch-action:manipulation;transition:transform .1s,box-shadow .1s}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--edge)}
.btn:disabled{opacity:.45;box-shadow:none;cursor:not-allowed}
.btn.ghost{background:var(--card);color:var(--ink)}
.btn.sm{padding:5px 14px;font-size:.8rem;min-height:40px}
.btn.danger{background:var(--badbg);color:var(--bad)}
.btn.armed{background:var(--bad);color:#fff}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.note{background:var(--soft);border:2px solid var(--edge);border-radius:10px;padding:10px 14px;font-size:.86rem;font-weight:600;margin-bottom:14px;line-height:1.8}
.note.warn{background:var(--warnbg);color:var(--warn)}
.empty{text-align:center;color:var(--mute);font-weight:600;padding:30px 14px;background:var(--card);border:2px dashed var(--edge);border-radius:12px;line-height:2}
.err{color:var(--bad);font-size:.84rem;font-weight:700;min-height:1.2em;margin-top:6px}
.opt{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.bar{background:var(--card);border:2px solid var(--edge);border-radius:10px;height:44px;position:relative;overflow:hidden;flex:1;min-width:0}
.bar i{position:absolute;top:0;bottom:0;right:0;background:var(--soft);border-left:4px solid var(--brand)}
.bar .in{position:relative;display:flex;justify-content:space-between;gap:8px;padding:0 14px;line-height:40px;font-size:.88rem;font-weight:700}
.bar .in b{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.choice{display:flex;align-items:center;gap:12px;width:100%;text-align:right;padding:12px 14px;margin-bottom:10px;border:2px solid var(--edge);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-weight:700;cursor:pointer;min-height:52px;touch-action:manipulation}
.choice.sel{background:var(--accent);color:#101114;box-shadow:3px 3px 0 var(--edge)}
.dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--edge);flex:none;background:var(--card)}
.choice.sel .dot{background:#101114}
.lockbar{background:var(--warnbg);color:var(--warn);border:2px solid var(--edge);border-radius:10px;padding:9px 14px;font-size:.86rem;font-weight:700;margin-bottom:12px}
.msgs{display:flex;flex-direction:column;gap:12px;margin-bottom:14px}
.msg{display:flex;gap:8px;align-items:flex-end;min-width:0}
.msg.me{flex-direction:row-reverse}
.av{width:38px;height:38px;border-radius:8px;border:2px solid var(--edge);flex:none;color:#fff;display:flex;align-items:center;justify-content:center;font:900 .95rem var(--f-display)}
.bub{background:var(--card);border:2px solid var(--edge);border-radius:12px 12px 12px 3px;box-shadow:2px 2px 0 var(--edge);padding:8px 14px;max-width:min(82%,520px);min-width:0}
.msg.me .bub{background:var(--mebg);border-radius:12px 12px 3px 12px}
.who{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:.76rem;color:var(--mute);font-weight:600}
.who b{color:var(--ink);font-weight:800;font-size:.84rem}
.tx{white-space:pre-wrap;line-height:1.7}
.mtools{display:flex;gap:6px;margin-top:6px}
.mtools .btn{min-height:34px;padding:2px 10px;font-size:.72rem;box-shadow:2px 2px 0 var(--edge)}
.composer{position:sticky;bottom:calc(78px + env(safe-area-inset-bottom,0px));background:var(--card);border:2px solid var(--edge);border-radius:14px;box-shadow:3px 3px 0 var(--edge);padding:8px;display:flex;gap:8px;align-items:flex-end}
.composer textarea{min-height:46px;max-height:120px;border:0;background:var(--field);padding:11px 13px;resize:none;border-radius:8px}
.composer textarea:focus{box-shadow:none}
.composer .btn{min-width:76px;padding:0 16px;white-space:nowrap}
.composer .off{flex:1;text-align:center;color:var(--mute);font-weight:700;font-size:.88rem;padding:10px}
.mgr{margin-bottom:14px}
.mrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:2px dashed var(--line)}.mrow:last-child{border:0}.mrow span{min-width:0}
.thread{display:flex;flex-direction:column;gap:12px;margin-bottom:14px}
.fb{max-width:90%;padding:10px 14px;border:2px solid var(--edge);border-radius:12px;background:var(--card);box-shadow:3px 3px 0 var(--edge)}
.fb.s{background:var(--mebg);align-self:flex-start}
.fb.a{background:var(--soft);align-self:flex-end}
.srow{display:flex;align-items:center;gap:12px;width:100%;text-align:right;background:var(--card);border:2px solid var(--edge);border-radius:12px;padding:12px 14px;margin-bottom:12px;box-shadow:3px 3px 0 var(--edge);font:inherit;color:inherit;cursor:pointer;min-height:58px}
.srow .grow{flex:1;min-width:0}
nav{position:fixed;bottom:0;left:0;right:0;z-index:9;background:var(--card);border-top:3px solid var(--edge)}
.navin{max-width:720px;margin:0 auto;display:flex;gap:4px;padding:5px max(8px,env(safe-area-inset-left,0px)) calc(5px + env(safe-area-inset-bottom,0px))}
nav button{position:relative;flex:1;min-width:0;border:2px solid transparent;background:none;color:var(--mute);font:800 .68rem var(--f-body);display:flex;flex-direction:column;align-items:center;gap:0;padding:6px 2px;cursor:pointer;border-radius:10px;min-height:54px;touch-action:manipulation}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button.on{background:var(--accent);color:#101114;border-color:var(--edge)}
nav .pip{position:absolute;top:5px;left:50%;margin-left:9px;width:11px;height:11px;border-radius:50%;background:var(--bad);border:2px solid var(--card)}
.sheet{position:fixed;inset:0;z-index:30;background:rgba(16,17,20,.62);display:flex;align-items:center;justify-content:center;padding:16px}
.sheetcard{background:var(--card);border:3px solid var(--edge);border-radius:14px;box-shadow:5px 5px 0 var(--edge);padding:22px 20px;width:100%;max-width:400px}
.sheetcard h2{margin:0 0 6px;font:900 1.3rem var(--f-display)}
.sheetcard p{margin:0 0 6px;color:var(--mute);font-size:.9rem;font-weight:600}
.toast{position:fixed;bottom:calc(92px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#101114;color:#FFD83A;border:2px solid #FFD83A;padding:10px 22px;border-radius:10px;font:800 .86rem var(--f-body);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40;max-width:88%;text-align:center}
.toast.show{opacity:1}
.foot{text-align:center;color:var(--mute);font-size:.74rem;font-weight:600;margin-top:22px}
.lnk{background:none;border:0;color:var(--mute);font:inherit;font-size:.74rem;font-weight:700;text-decoration:underline;cursor:pointer;min-height:44px;padding:0 12px}
.sig{display:flex;flex-direction:column;align-items:center;gap:2px;margin:28px 0 6px;color:var(--mute);font-size:.74rem;font-weight:600}
.sig .mono{width:62px;height:62px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:#101114;color:#FFD83A;border:3px solid var(--edge);box-shadow:3px 3px 0 var(--accent);font:700 2rem/1 Caveat,"Segoe Script","Brush Script MT",cursive;direction:ltr}
.sig svg{display:none}
.sig b{color:var(--ink);font-weight:800;font-size:.8rem}
@media(max-width:600px){.hero h2{font-size:1.65rem}.seal{width:60px;height:60px;font-size:1.9rem}.cols>*{min-width:100%}form .actions .btn{width:100%}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<script>document.documentElement.dir="rtl";document.documentElement.lang="ar";</script>

<header><div class="wrap hrow">
  <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#C9A227" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 3 8l9 5 9-5-9-5z"/><path d="M7 10.5V16c0 1.2 2.2 3 5 3s5-1.8 5-3v-5.5"/><path d="M21 8v6"/></svg></div>
  <div class="htxt"><h1>منصة رئيس المرحلة الرابعة</h1><p>الحمزة صباح · الصف B4</p></div>
  <button class="chip" id="chip" type="button" data-act="chip" hidden></button>
</div></header>
<main class="wrap" id="main"></main>
<nav><div class="navin" id="nav"></div></nav>
<div class="sheet" id="sheet" hidden>
  <form class="sheetcard" id="f-name" autocomplete="off">
    <h2>ما اسمك؟</h2>
    <p>سيظهر هذا الاسم بجانب رسائلك في الدردشة، ويراه رئيس المرحلة الرابعة مع ملاحظاتك.</p>
    <label for="nameIn">الاسم</label>
    <input id="nameIn" name="name" maxlength="24" required placeholder="مثال: علي حسن">
    <div class="err" id="nameErr"></div>
    <div class="actions"><button class="btn" id="nameSave" type="submit">حفظ الاسم</button><button class="btn ghost" id="nameCancel" type="button" data-act="sheet-close" hidden>إلغاء</button></div>
  </form>
</div>
<div class="sheet" id="sheetA" hidden>
  <form class="sheetcard" id="f-login" autocomplete="on">
    <h2>دخول رئيس المرحلة الرابعة</h2>
    <p>هذا الدخول لرئيس المرحلة الرابعة فقط. الطلبة لا يحتاجون إلى حساب.</p>
    <label for="admEmail">البريد الإلكتروني</label>
    <input id="admEmail" name="email" type="email" autocomplete="username" required>
    <label for="admPass">كلمة المرور</label>
    <input id="admPass" name="pass" type="password" autocomplete="current-password" required>
    <div class="err" id="admErr"></div>
    <div class="actions"><button class="btn" id="admGo" type="submit">دخول</button><button class="btn ghost" type="button" data-act="login-close">إلغاء</button></div>
  </form>
</div>
<div class="toast" id="toast" role="status"></div>

<script src="config.js"></script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,doc,collection,getDoc,setDoc,updateDoc,deleteDoc,addDoc,onSnapshot,query,orderBy,limit} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {getAuth,onAuthStateChanged,signInAnonymously,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
var cfg=window.APP_CONFIG||{};
var fb=cfg.firebase||{};
var be={configured:!!(fb.apiKey&&String(fb.apiKey).indexOf("PASTE")<0&&fb.projectId),adminEmail:String(cfg.adminEmail||"").trim().toLowerCase()};
if(be.configured){
  var app=initializeApp(fb),auth=getAuth(app),fs=getFirestore(app);
  var docRef=function(path){var r=doc(fs,path);return{id:r.id,path:path,get:function(){return getDoc(r)},set:function(d){return setDoc(r,d)},update:function(d){return updateDoc(r,d)},delete:function(){return deleteDoc(r)},onSnapshot:function(n,e){return onSnapshot(r,n,e)},collection:function(s){return colRef(path+"/"+s)}}};
  var colRef=function(path,cons){cons=cons||[];var c=collection(fs,path);var q=function(){return cons.length?query.apply(null,[c].concat(cons)):c};
    return{path:path,orderBy:function(f,d){return colRef(path,cons.concat([orderBy(f,d)]))},limit:function(n){return colRef(path,cons.concat([limit(n)]))},onSnapshot:function(n,e){return onSnapshot(q(),n,e)},add:function(d){return addDoc(c,d)},doc:function(id){return docRef(path+"/"+id)}}};
  be.db={doc:docRef,collection:function(p){return colRef(p)}};
  be.onUser=function(cb){onAuthStateChanged(auth,function(u){if(!u){signInAnonymously(auth).catch(function(e){cb(null,e)});return}cb({uid:u.uid,email:u.email||""})})};
  be.signInAdmin=function(e,p){return signInWithEmailAndPassword(auth,e,p)};
  be.signOut=function(){return signOut(auth)};
}
window.HubBackend=be;window.dispatchEvent(new Event("hubbackend"));
</script>
<script>
(function(){
"use strict";
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
var ADMIN_NAME="الحمزة صباح";
var CATS=["عام","عاجل","أكاديمي","أنشطة وأندية"];
var TOPICS=["المرافق","الدراسة","الحياة الطلابية","اقتراح","شكوى","أخرى"];
var D={ann:[],polls:[],votes:[],members:{},mutes:{},cfg:{},chat:[],thread:[],ready:{}};
var backend=null,statusMsg='',db=null,uid=null,isAdmin=false,realAdmin=false,preview=false,isOwner=false,canWrite=null,tab="home";
var threadUid=null,unsubThread=null,pending={},armed={},showMgr=false,sending=false,nameForced=false;

var IC={
 home:'<svg viewBox="0 0 24 24"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/></svg>',

  if(isAdmin&&!threadUid){
    var ids=Object.keys(D.members).filter(function(k){return D.members[k].fbAt}).sort(function(a,b){return D.members[b].fbAt-D.members[a].fbAt});
    $("#live").innerHTML=(ids.length?ids.map(function(k){var m=D.members[k],un=m.fbAt>(m.adminSeenAt||0);return '<button class="srow" type="button" data-act="fb-open" data-id="'+esc(k)+'">'+avatar(k)+'<span class="grow"><b>'+esc(m.name||"طالب")+'</b><br><span class="meta">آخر رسالة: '+fmtT(m.fbAt)+'</span></span>'+(un?'<span class="dotbadge" title="جديد"></span><span class="tag warn">جديد</span>':"")+'</button>'}).join(""):'<div class="empty">لا توجد ملاحظات بعد.<br>ستظهر هنا عندما يرسل الطلبة ملاحظاتهم.</div>')+foot();return}
  var nb=nearBottom();
  $("#live").innerHTML=(D.thread.length?'<div class="thread">'+D.thread.map(thHtml).join("")+'</div>':'<div class="empty">'+(isAdmin?"لا توجد رسائل في هذه المحادثة.":"لم ترسل أي ملاحظة بعد.")+'</div>')+(isAdmin?"":readOnlyNote()+foot());
  if(isAdmin&&nb)scrollBottom(true)}

/* ---------- name sheet ---------- */
function openSheet(forced){nameForced=!!forced;$("#sheet").hidden=false;$("#nameCancel").hidden=!!forced;$("#nameIn").value=myName();$("#nameErr").textContent="";setTimeout(function(){$("#nameIn").focus()},50)}
function closeSheet(){$("#sheet").hidden=true}
function validName(n){
  n=n.replace(/\s+/g," ").trim();
  if(n.length<2)return{e:"الاسم قصير جدًا. اكتب حرفين على الأقل."};
  if(n.indexOf("رئيس المرحلة الرابعة")>-1||n.replace(/\s/g,"")===ADMIN_NAME.replace(/\s/g,""))return{e:"هذا الاسم محجوز. اكتب اسمك الحقيقي."};
  for(var k in D.members){if(k!==uid&&D.members[k].name&&D.members[k].name.toLowerCase()===n.toLowerCase())return{e:"هذا الاسم مستخدم. أضف حرفًا من اسم العائلة للتمييز."}}
  return{n:n}}
function ensureName(){if(isAdmin||preview)return true;if(myName())return true;openSheet(true);return false}

/* ---------- writes ---------- */
function snap(f){var o={};for(var i=0;i<f.elements.length;i++){var e=f.elements[i];if(e.name)o[e.name]=e.value}return o}
function restore(f,o){for(var k in o){if(f.elements[k]&&!f.elements[k].value)f.elements[k].value=o[k]}}
var forms={
 "f-login":function(f){
   var be=backend;if(!be||!be.configured){$("#admErr").textContent="الموقع غير مربوط بقاعدة البيانات بعد.";return}
   var btn=$("#admGo");btn.disabled=true;$("#admErr").textContent="";
   be.signInAdmin(f.elements.email.value.trim(),f.elements.pass.value).then(function(){f.elements.pass.value=""}).catch(function(e){
     $("#admErr").textContent=(e&&/network/.test(e.code||""))?"تعذّر الاتصال. تحقق من الإنترنت.":"البريد الإلكتروني أو كلمة المرور غير صحيحة."}).then(function(){btn.disabled=false})},
 "f-name":function(f){
   var v=validName(f.elements.name.value);if(v.e){$("#nameErr").textContent=v.e;return}
   var cur=D.members[uid],opt=Object.assign({},cur||{},{name:v.n});D.members[uid]=opt;closeSheet();paint();
   W(function(){return cur?db.doc("members/"+uid).update({name:v.n}):db.doc("members/"+uid).set({name:v.n,joinedAt:Date.now()})},"تم حفظ الاسم").then(function(ok){if(ok)return;if(D.members[uid]===opt){if(cur)D.members[uid]=cur;else delete D.members[uid]}openSheet(!(cur&&cur.name));$("#nameErr").textContent="تعذّر حفظ الاسم. حاول مرة أخرى.";paint()})},
 "f-ann":function(f){var t=f.elements.title.value.trim(),b=f.elements.body.value.trim();if(!t||!b)return;var sv=snap(f);f.reset();
   W(function(){return db.collection("announcements").add({title:t,body:b,cat:f.elements.cat.value,pin:false,ts:Date.now()})},"تم نشر الإعلان").then(function(ok){if(!ok)restore(f,sv)})},
 "f-poll":function(f){var q=f.elements.q.value.trim(),o=f.elements.opts.value.split("\n").map(function(s){return s.trim()}).filter(Boolean);
   if(o.length<2){toast("أضف خيارين على الأقل");return}var sv=snap(f);f.reset();
   W(function(){return db.collection("polls").add({q:q,opts:o.slice(0,10),closed:false,ts:Date.now()})},"تم إنشاء الاستطلاع").then(function(ok){if(!ok)restore(f,sv)})},
 "f-chat":function(f){
   var ta=f.elements.text,tx=ta.value.trim();if(!tx)return;
   if(!ensureName())return;
   if(chatState()!=="ok"){toast("لا يمكنك الكتابة الآن");return}
   ta.value="";ta.focus();
   W(function(){return db.collection("chat").add({uid:uid,text:tx.slice(0,500),ts:Date.now()})}).then(function(ok){if(!ok&&!ta.value)ta.value=tx})},
 "f-fb":function(f){
   var tx=f.elements.text.value.trim();if(!tx)return;if(!ensureName())return;var ts=Date.now();var sv=snap(f);f.reset();
   W(function(){return db.collection("inbox/"+uid+"/items").add({from:"s",topic:f.elements.topic.value,text:tx,ts:ts}).then(function(){return db.doc("members/"+uid).update({fbAt:ts})})},"تم إرسال ملاحظتك").then(function(ok){if(!ok)restore(f,sv)})},
 "f-reply":function(f){
   var tx=f.elements.text.value.trim();if(!tx||!threadUid)return;var ts=Date.now(),id=threadUid;var sv=snap(f);f.reset();
   W(function(){return db.collection("inbox/"+id+"/items").add({from:"a",text:tx,ts:ts}).then(function(){return db.doc("members/"+id).update({replyAt:ts,adminSeenAt:ts})})},"تم إرسال الرد").then(function(ok){if(!ok)restore(f,sv)})}
};
function openThread(id){
  threadUid=id;D.thread=[];if(unsubThread){unsubThread();unsubThread=null}
  unsubThread=db.collection("inbox/"+id+"/items").orderBy("ts","asc").limit(200).onSnapshot(function(s){
    D.thread=s.docs.map(function(d){return Object.assign({id:d.id},d.data())});
    var last=D.thread.length?D.thread[D.thread.length-1].ts:0,m=D.members[id];
    if(isAdmin&&m&&last>(m.adminSeenAt||0)&&D.thread[D.thread.length-1].from==="s")db.doc("members/"+id).update({adminSeenAt:last}).catch(function(){});
    schedule()},function(){schedule()});
  show("fb")}
function closeThread(){threadUid=null;if(unsubThread){unsubThread();unsubThread=null}D.thread=[];show("fb")}
var seenBusy=false;
function togglePreview(){preview=!preview;isAdmin=realAdmin&&!preview;showMgr=false;threadUid=null;if(unsubThread){unsubThread();unsubThread=null}D.thread=[];show(tab);renderChip()}
function markSeen(){
  if(realAdmin||!uid||seenBusy)return;var m=D.members[uid];
  if(m&&m.replyAt&&m.replyAt>(m.replySeenAt||0)){seenBusy=true;db.doc("members/"+uid).update({replySeenAt:m.replyAt}).catch(function(){}).then(function(){seenBusy=false})}}

var acts={
 go:function(id){show(id)},
 letter:function(){letterOpen=!letterOpen;paint()},
 chip:function(){if(realAdmin){togglePreview();return}openSheet(false)},
 "sheet-close":function(){if(!nameForced)closeSheet()},
 "ann-pin":function(id){var a=D.ann.filter(function(x){return x.id===id})[0];if(a)W(function(){return db.doc("announcements/"+id).update({pin:!a.pin})})},
 "ann-del":function(id){if(!isArmed("ann"+id))return arm("ann"+id);W(function(){return db.doc("announcements/"+id).delete()},"تم الحذف")},
 "poll-pick":function(id,i){pending[id]=+i;paint()},
 "poll-confirm":function(id){
   var i=pending[id];if(i==null)return;if(!ensureName())return;
   var mine=mineVotes();if(mine[id]!=null)return;
   W(function(){return db.doc("votes/"+id+"_"+uid).set({pid:id,uid:uid,choice:i,ts:Date.now()})},"تم تسجيل صوتك")},
 "poll-close":function(id){var p=D.polls.filter(function(x){return x.id===id})[0];if(p)W(function(){return db.doc("polls/"+id).update({closed:!p.closed})})},
 "poll-del":function(id){if(!isArmed("poll"+id))return arm("poll"+id);W(function(){return db.doc("polls/"+id).delete()},"تم الحذف")},
 "chat-mgr":function(){showMgr=!showMgr;paint()},
 "chat-lock":function(){var l=!!(D.cfg.chat&&D.cfg.chat.locked);W(function(){return db.doc("settings/chat").set({locked:!l,at:Date.now()})},l?"تم فتح الدردشة":"تم قفل الدردشة")},
 mute:function(id){W(function(){return db.doc("mutes/"+id).set({at:Date.now()})},"تم الكتم")},
 unmute:function(id){W(function(){return db.doc("mutes/"+id).delete()},"تم إلغاء الكتم")},
 "msg-del":function(id){if(!isArmed("msg"+id))return arm("msg"+id);W(function(){return db.doc("chat/"+id).delete()})},
 "fb-open":function(id){openThread(id)},
 "fb-back":function(){closeThread()},
 "admin-login":function(){openLogin()},
 "admin-out":function(){if(backend)backend.signOut()},
 "login-close":function(){closeLogin()}
};
document.addEventListener("click",function(e){var b=e.target.closest("[data-act]");if(!b||b.disabled)return;var a=acts[b.dataset.act];if(a)a(b.dataset.id,b.dataset.i)});
document.addEventListener("submit",function(e){var f=e.target.closest("form");if(!f)return;e.preventDefault();if(!forms[f.id])return;if(f.id==="f-login"||(db&&uid))forms[f.id](f)});
document.addEventListener("keydown",function(e){if(e.target.id==="chatIn"&&e.key==="Enter"&&!e.shiftKey){e.preventDefault();var f=$("#f-chat");if(f&&forms["f-chat"])forms["f-chat"](f)}});

/* ---------- live data ---------- */
var subs=[];
function sub(q,fn){var u=q.onSnapshot(function(s){fn(s);schedule()},function(e){if(window.console)console.warn("db",e&&e.code)});subs.push(u);return u}
function stopSubs(){subs.forEach(function(u){try{u()}catch(e){}});subs=[]}
function rows(s){return s.docs.map(function(d){return Object.assign({id:d.id},d.data())})}
function map(s){var o={};s.docs.forEach(function(d){o[d.id]=d.data()});return o}
function startSubs(){
  sub(db.collection("announcements").orderBy("ts","desc").limit(100),function(s){D.ann=rows(s)});
  sub(db.collection("polls").orderBy("ts","desc").limit(50),function(s){D.polls=rows(s).filter(function(p){return Array.isArray(p.opts)})});
  sub(db.collection("votes").limit(1000),function(s){D.votes=rows(s)});
  sub(db.collection("mutes"),function(s){D.mutes=map(s)});
  sub(db.collection("chat").orderBy("ts","desc").limit(200),function(s){D.chat=rows(s)});
  sub(db.collection("settings"),function(s){
    D.cfg=map(s);
    if(realAdmin&&!D.ready.admin&&(!D.cfg.admin||D.cfg.admin.uid!==uid)){D.ready.admin=true;db.doc("settings/admin").set({uid:uid}).catch(function(){})}});
  sub(db.collection("members").limit(1000),function(s){
    D.members=map(s);
    if(!D.ready.members){D.ready.members=true;if(!realAdmin&&!(D.members[uid]&&D.members[uid].name)&&canWrite!==false)openSheet(true)}
    if(tab==="fb")markSeen()});
  if(!realAdmin){
    sub(db.collection("inbox/"+uid+"/items").orderBy("ts","asc").limit(200),function(s){D.thread=rows(s)})}
}

/* ---------- boot ---------- */
function openLogin(){$("#sheetA").hidden=false;$("#admErr").textContent="";setTimeout(function(){$("#admEmail").focus()},50)}
function closeLogin(){$("#sheetA").hidden=true}
var started=false;
function resetData(){D.ann=[];D.polls=[];D.votes=[];D.members={};D.mutes={};D.cfg={};D.chat=[];D.thread=[];D.ready={};threadUid=null;if(unsubThread){unsubThread();unsubThread=null}}
function onUser(u){
  stopSubs();resetData();uid=u.uid;
  realAdmin=!!u.email&&!!backend.adminEmail&&u.email.toLowerCase()===backend.adminEmail;
  isAdmin=realAdmin&&!preview;canWrite=true;showMgr=false;
  startSubs();closeLogin();show(tab);renderChip()}
function boot2(){
  if(started)return;started=true;backend=window.HubBackend;
  if(!backend.configured){paint();return}
  db=backend.db;
  backend.onUser(function(u,err){
    if(!u){statusMsg=err?"تعذّر تسجيل دخولك. تأكد أن الدخول المجهول مفعّل في Firebase.":"";paint();return}
    onUser(u)})}
function boot(){
  show("home");
  if(window.HubBackend){boot2();return}
  window.addEventListener("hubbackend",boot2);
  setTimeout(function(){if(!started){statusMsg="تعذّر تحميل الخدمة. تحقق من الإنترنت ثم أعد فتح الصفحة.";paint()}},10000)}
boot();
})();
</script>
